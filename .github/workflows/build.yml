name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Dependencias (libreria)
        run: npm ci

      - name: Generar codigo Nitro
        run: npx nitrogen

      - name: Dependencias (example)
        run: npm ci
        working-directory: example

      - name: Modelo MediaPipe
        run: |
          D=example/android/app/src/main/assets
          mkdir -p $D
          [ -f $D/pose_landmarker_lite.task ] || curl -fL -o $D/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task

      - name: Componentes del SDK de Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Build Release APK (JS incluido, no necesita Metro)
        working-directory: example/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: example/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
